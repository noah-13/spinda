[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlv-toolkits"
version = "0.1.0"
description = "HLV Toolkits for NLI and distributional label experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.26.0",
    "datasets>=4.5.0",
    "dcor>=0.7",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0",
    "plotly>=6.5.2",
    "pytest>=9.0.2",
    "python-ternary>=1.0.8",
    "scipy>=1.11.0,<1.14.0",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.0",
    "torch>=2.2.0,<2.4.0",
    "transformers>=4.57.6",
    "wandb>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "accelerate>=0.26.0",
    "pytest>=9.0.2",
    "wandb>=0.16.0",  # For experiment tracking during development
]
plot = [
    "matplotlib>=3.8.0",
    "python-ternary>=1.0.8",
]

[tool.setuptools.packages.find]
include = ["hlv_toolkits*"]
