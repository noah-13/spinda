[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinda-hlv"
version = "0.1.0"
description = "SPInDa: Simple Prediction and Interpretation of Data with Human Label Variation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.26.0",
    "datasets>=4.5.0",
    "dcor>=0.7",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0",
    "plotly>=6.5.2",
    "pytest>=9.0.2",
    "python-ternary>=1.0.8",
    "scipy>=1.11.0,<1.14.0",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.0",
    "torch>=2.6.0,<2.7.0",
    "transformers>=4.57.6",
    "wandb>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "accelerate>=0.26.0",
    "pytest>=9.0.2",
    "wandb>=0.16.0",  # For experiment tracking during development
]
plot = [
    "matplotlib>=3.8.0",
    "python-ternary>=1.0.8",
]

[project.scripts]
spinda = "spinda.cli:main"

[tool.setuptools.packages.find]
include = ["spinda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
