[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nli-toolkits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.6",
]

[project.optional-dependencies]
dev = [
    "wandb>=0.16.0",  # For experiment tracking during development
]
plot = [
    "matplotlib>=3.8.0",
]

[tool.setuptools]
packages = ["nli_toolkits"]
